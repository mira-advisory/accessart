AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AccessArt - single code-based API (one Lambda behind one catch-all HTTP API route),
  DynamoDB tables, and the api.accessart.net custom domain. Everything gateway/table/
  domain-shaped lives here, never console-only (CLAUDE.md rule 3). HARD RULE: named
  resources take the `aa` prefix (CLAUDE.md rule 0); the stack name `accessart` and its
  auto-generated `accessart-*` IAM roles are the two documented exceptions.

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 512
    Timeout: 30

Resources:
  AaApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aa-api
      CodeUri: ../backend/functions/accessart-api/
      Handler: index.handler
      Description: AccessArt single code-based API - all routes dispatched in app.mjs
      Environment:
        Variables:
          STAGE: prod
          WAITLIST_TABLE: !Ref AaWaitlistTable
          USERS_TABLE: !Ref AaUsersTable
          MARKETS_TABLE: !Ref AaMarketsTable
          COGNITO_POOL_ID: !Ref AaUserPool
          COGNITO_CLIENT_ID: !Ref AaUserPoolClient
          FROM_EMAIL: accessart <hello@accessart.net>
          NOTIFY_EMAIL: ben.john.dawes@gmail.com
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AaWaitlistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AaStagingWaitlistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AaUsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AaStagingUsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AaMarketsTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/accessart.net"
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref AaHttpApi
            Path: /{proxy+}
            Method: ANY

  AaHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: AccessArt HTTP API - one catch-all route, code-routed in the Lambda
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - PUT
          - DELETE
          - OPTIONS

  AaWaitlistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: aa_waitlist
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  AaStagingWaitlistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: aa_staging_waitlist
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  AaUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: aa-users
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
            - EMAIL_OTP
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        From: accessart <hello@accessart.net>
        SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/accessart.net"
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  AaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: aa-web
      UserPoolId: !Ref AaUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  AaUsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: aa_users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: handle
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: HandleIndex
          KeySchema:
            - AttributeName: handle
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AaStagingUsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: aa_staging_users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: handle
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: HandleIndex
          KeySchema:
            - AttributeName: handle
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AaMarketsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: aa_markets
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: market_id
          AttributeType: S
      KeySchema:
        - AttributeName: market_id
          KeyType: HASH

  AaApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: api.accessart.net
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: api.accessart.net
          HostedZoneId: Z1036031314RGU6VKSXZZ

  AaApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: api.accessart.net
      DomainNameConfigurations:
        - CertificateArn: !Ref AaApiCertificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  AaApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn: AaHttpApiApiGatewayDefaultStage
    Properties:
      ApiId: !Ref AaHttpApi
      DomainName: !Ref AaApiDomain
      Stage: $default

  AaApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z1036031314RGU6VKSXZZ
      Name: api.accessart.net
      Type: A
      AliasTarget:
        DNSName: !GetAtt AaApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt AaApiDomain.RegionalHostedZoneId

  AaMailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: aa-mail-400792111355
      LifecycleConfiguration:
        Rules:
          - Id: expire-inbound
            Status: Enabled
            Prefix: inbound/
            ExpirationInDays: 90

  AaMailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AaMailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${AaMailBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AaMailForwarderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aa-mail-forwarder
      CodeUri: ../backend/functions/aa-mail-forwarder/
      Handler: index.handler
      MemorySize: 256
      Description: Forwards inbound @accessart.net mail to Ben's inbox
      Environment:
        Variables:
          MAIL_BUCKET: !Ref AaMailBucket
          MAIL_PREFIX: inbound/
          FORWARD_TO: ben.john.dawes@gmail.com
          FROM_EMAIL: hello@accessart.net
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref AaMailBucket
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/accessart.net"

  AaMailForwarderInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AaMailForwarderFunction
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  AaMailRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: aa-mail

  AaMailRule:
    Type: AWS::SES::ReceiptRule
    DependsOn:
      - AaMailBucketPolicy
      - AaMailForwarderInvokePermission
    Properties:
      RuleSetName: !Ref AaMailRuleSet
      Rule:
        Name: forward-to-ben
        Enabled: true
        ScanEnabled: true
        Recipients:
          - ben@accessart.net
          - hello@accessart.net
        Actions:
          - S3Action:
              BucketName: !Ref AaMailBucket
              ObjectKeyPrefix: inbound/
          - LambdaAction:
              FunctionArn: !GetAtt AaMailForwarderFunction.Arn
              InvocationType: Event

  AaMxRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z1036031314RGU6VKSXZZ
      Name: accessart.net
      Type: MX
      TTL: 300
      ResourceRecords:
        - "10 inbound-smtp.ap-southeast-2.amazonaws.com"

Outputs:
  ApiUrl:
    Description: Custom-domain base URL for the AccessArt API
    Value: https://api.accessart.net
  RawApiUrl:
    Description: Raw execute-api URL (works before/without the custom domain)
    Value: !Sub "https://${AaHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: Cognito user pool id (VITE_COGNITO_POOL_ID)
    Value: !Ref AaUserPool
  UserPoolClientId:
    Description: Cognito app client id (VITE_COGNITO_CLIENT_ID)
    Value: !Ref AaUserPoolClient
