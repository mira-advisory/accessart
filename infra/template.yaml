AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AccessArt stage-aware stack: single code-based API (one Lambda behind one catch-all
  HTTP API route), DynamoDB tables, Cognito, custom domain. Deployed twice: stack
  "accessart" with Stage=prod and stack "accessart-dev" with Stage=dev. Mail receiving
  and the apex MX are prod-only. Everything lives here, never console-only (CLAUDE.md
  rule 3). Named resources take the aa prefix (rule 0); the stack names and their
  auto-generated accessart-* IAM roles are the documented exceptions.

Parameters:
  Stage:
    Type: String
    AllowedValues:
      - prod
      - dev
    Default: prod

Conditions:
  IsProd: !Equals [!Ref Stage, prod]

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 512
    Timeout: 30

Resources:
  AaApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !If [IsProd, aa-api, aa-api-dev]
      CodeUri: ../backend/functions/accessart-api/
      Handler: index.handler
      Description: AccessArt single code-based API - all routes dispatched in app.mjs
      Environment:
        Variables:
          STAGE: !Ref Stage
          WAITLIST_TABLE: !Ref AaWaitlistTable
          USERS_TABLE: !Ref AaUsersTable
          MARKETS_TABLE: !Ref AaMarketsTable
          COGNITO_POOL_ID: !Ref AaUserPool
          COGNITO_CLIENT_ID: !Ref AaUserPoolClient
          MEDIA_BUCKET: !Ref AaMediaBucket
          ARTWORKS_TABLE: !Ref AaArtworksTable
          FROM_EMAIL: accessart <hello@accessart.net>
          NOTIFY_EMAIL: ben.john.dawes@gmail.com
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AaWaitlistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AaUsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AaMarketsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AaArtworksTable
        - S3CrudPolicy:
            BucketName: !Ref AaMediaBucket
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/accessart.net"
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref AaHttpApi
            Path: /{proxy+}
            Method: ANY

  AaHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: !Sub "AccessArt HTTP API (${Stage}) - one catch-all route, code-routed in the Lambda"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - PUT
          - DELETE
          - OPTIONS

  AaWaitlistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !If [IsProd, aa_waitlist, aa_dev_waitlist]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  AaUsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !If [IsProd, aa_users, aa_dev_users]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: handle
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: HandleIndex
          KeySchema:
            - AttributeName: handle
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AaMarketsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !If [IsProd, aa_markets, aa_dev_markets]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: market_id
          AttributeType: S
      KeySchema:
        - AttributeName: market_id
          KeyType: HASH

  AaMediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !If [IsProd, aa-media-400792111355, aa-media-dev-400792111355]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "*"
            MaxAge: 3600

  AaMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AaMediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${AaMediaBucket.Arn}/artworks/*"

  AaArtworksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !If [IsProd, aa_artworks, aa_dev_artworks]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: artwork_id
          AttributeType: S
        - AttributeName: artist_id
          AttributeType: S
        - AttributeName: market_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: artwork_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ArtistIndex
          KeySchema:
            - AttributeName: artist_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: MarketIndex
          KeySchema:
            - AttributeName: market_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AaUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !If [IsProd, aa-users, aa-users-dev]
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
            - EMAIL_OTP
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        From: accessart <hello@accessart.net>
        SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/accessart.net"
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  AaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !If [IsProd, aa-web, aa-web-dev]
      UserPoolId: !Ref AaUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  AaApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !If [IsProd, api.accessart.net, dev-api.accessart.net]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !If [IsProd, api.accessart.net, dev-api.accessart.net]
          HostedZoneId: Z1036031314RGU6VKSXZZ

  AaApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !If [IsProd, api.accessart.net, dev-api.accessart.net]
      DomainNameConfigurations:
        - CertificateArn: !Ref AaApiCertificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  AaApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn: AaHttpApiApiGatewayDefaultStage
    Properties:
      ApiId: !Ref AaHttpApi
      DomainName: !Ref AaApiDomain
      Stage: $default

  AaApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z1036031314RGU6VKSXZZ
      Name: !If [IsProd, api.accessart.net, dev-api.accessart.net]
      Type: A
      AliasTarget:
        DNSName: !GetAtt AaApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt AaApiDomain.RegionalHostedZoneId

  AaMailBucket:
    Type: AWS::S3::Bucket
    Condition: IsProd
    DeletionPolicy: Retain
    Properties:
      BucketName: aa-mail-400792111355
      LifecycleConfiguration:
        Rules:
          - Id: expire-inbound
            Status: Enabled
            Prefix: inbound/
            ExpirationInDays: 90

  AaMailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsProd
    Properties:
      Bucket: !Ref AaMailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${AaMailBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AaMailForwarderFunction:
    Type: AWS::Serverless::Function
    Condition: IsProd
    Properties:
      FunctionName: aa-mail-forwarder
      CodeUri: ../backend/functions/aa-mail-forwarder/
      Handler: index.handler
      MemorySize: 256
      Description: Forwards inbound @accessart.net mail to Ben's inbox
      Environment:
        Variables:
          MAIL_BUCKET: !Ref AaMailBucket
          MAIL_PREFIX: inbound/
          FORWARD_TO: ben.john.dawes@gmail.com
          FROM_EMAIL: hello@accessart.net
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref AaMailBucket
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/accessart.net"

  AaMailForwarderInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: IsProd
    Properties:
      FunctionName: !Ref AaMailForwarderFunction
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  AaMailRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Condition: IsProd
    Properties:
      RuleSetName: aa-mail

  AaMailRule:
    Type: AWS::SES::ReceiptRule
    Condition: IsProd
    DependsOn:
      - AaMailBucketPolicy
      - AaMailForwarderInvokePermission
    Properties:
      RuleSetName: !Ref AaMailRuleSet
      Rule:
        Name: forward-to-ben
        Enabled: true
        ScanEnabled: true
        Recipients:
          - ben@accessart.net
          - hello@accessart.net
        Actions:
          - S3Action:
              BucketName: !Ref AaMailBucket
              ObjectKeyPrefix: inbound/
          - LambdaAction:
              FunctionArn: !GetAtt AaMailForwarderFunction.Arn
              InvocationType: Event

  AaMxRecord:
    Type: AWS::Route53::RecordSet
    Condition: IsProd
    Properties:
      HostedZoneId: Z1036031314RGU6VKSXZZ
      Name: accessart.net
      Type: MX
      TTL: 300
      ResourceRecords:
        - "10 inbound-smtp.ap-southeast-2.amazonaws.com"

Outputs:
  ApiUrl:
    Description: Custom-domain base URL for this stage's API
    Value: !If [IsProd, "https://api.accessart.net", "https://dev-api.accessart.net"]
  RawApiUrl:
    Description: Raw execute-api URL (works before/without the custom domain)
    Value: !Sub "https://${AaHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: Cognito user pool id (VITE_COGNITO_POOL_ID)
    Value: !Ref AaUserPool
  UserPoolClientId:
    Description: Cognito app client id (VITE_COGNITO_CLIENT_ID)
    Value: !Ref AaUserPoolClient
